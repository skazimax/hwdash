<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hwdash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 11h3l2-6 3 9 2-5h4' fill='none' stroke='%234ea1ff' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0f1115; --card: #171a21; --line: #262b35; --text: #e6e8eb;
  --muted: #9aa3ad; --faint: #8b95a1; --accent: #4ea1ff; --warm: #ff9f43;
  --hot: #ff6b6b; --ok: #5fd3a8; --btn: #2b3240; --base: #c9d1db;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 Inter, system-ui, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 24px; font-weight: 650; }
.sub, .status { font-size: 13px; color: var(--muted); }
.status.bad { color: var(--hot); }
.title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.seg button, .btn { border: 0; border-radius: 6px; min-height: 32px; padding: 4px 14px; font: inherit; font-size: 13px;
  cursor: pointer; background: transparent; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--btn); color: #fff; }
.btn { background: var(--card); border: 1px solid var(--line); color: var(--text); min-height: 40px; }
.btn[aria-pressed="true"], .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0d10; font-weight: 600; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  background: #1b2433; border: 1px solid #2c3d57; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #c7d3e3; }
.banner div { display: flex; gap: 8px; }
.banner[hidden] { display: none; }
h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--faint); }

/* Tiles: standard, hero (Overview), load */
.tile { all: unset; cursor: pointer; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile:hover { border-color: #3a4252; }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.editing .tile { cursor: default; }
.tile.off { opacity: .45; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.name { font-size: 13px; color: #b8c0c9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src { font-size: 11px; color: var(--faint); white-space: nowrap; }
.val { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
.big { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
.unit { font-size: 13px; color: var(--muted); margin-left: 4px; }
.dev { font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dev.up { color: #ffb86b; }
.mm { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.row.mm { flex-wrap: wrap; column-gap: 10px; }
.mm span { white-space: nowrap; }
.warm .big { color: #ffb86b; } .hot .big { color: var(--hot); }
.spark { width: 100%; height: 36px; display: block; }

.hero-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.hero { padding: 20px 22px 14px; gap: 10px; border-color: #2f3644; background: #1a1e26; }
.hero .name { font-size: 16px; font-weight: 600; color: var(--text); }
.hero .big { font-size: 56px; line-height: 1; letter-spacing: -0.02em; }
.hero .unit { font-size: 18px; }
.hero .dev { font-size: 13px; }
.hero .spark { height: 84px; }
.hero .mm { font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px;
  border-radius: 999px; background: rgba(95, 211, 168, .12); color: var(--ok); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.warm .pill { background: rgba(255, 159, 67, .14); color: #ffb86b; }
.hot .pill { background: rgba(255, 107, 107, .14); color: var(--hot); }

.load-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.load .spark { height: 44px; }
.cname { font-size: 15px; font-weight: 600; }
.cbig { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.extra { font-size: 12px; color: #b8c0c9; text-align: right; min-width: 0; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar div { height: 100%; background: var(--accent); border-radius: 3px; }

/* Sensor groups sit side by side while they fit; a group's width follows its tile count */
.groups { display: flex; flex-wrap: wrap; gap: 20px 16px; }
.group { min-width: 0; }
.gtiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }

.edit { display: flex; flex-direction: column; gap: 6px; }
.edit .checks { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.edit label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #b8c0c9; min-height: 32px; cursor: pointer; }
.edit input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.edit input[type=text] { width: 100%; min-height: 40px; background: #0f1115; border: 1px solid var(--line); border-radius: 8px;
  color: var(--text); font: inherit; padding: 6px 10px; }
.edit input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
.hint { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { font-size: 12px; color: var(--faint); }

dialog { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; width: min(960px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
.dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.dhead h3 { margin: 0; font-size: 18px; color: var(--text); }
.close { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 8px;
  min-width: 44px; min-height: 44px; font-size: 20px; cursor: pointer; }
.chart { position: relative; }
.chart svg { width: 100%; height: 300px; display: block; }
.tip { position: absolute; top: 4px; pointer-events: none; background: #0b0d10; border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; display: none; }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 12px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 0; border-top: 2px solid var(--accent); }
.sw.base { border-top: 2px dashed var(--base); }
.sw.band { height: 10px; border: 0; background: rgba(201, 209, 219, .14); }

/* Streaming tab */
.tabs { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.tabs[hidden], .tabs button[hidden] { display: none; }
.tabs button { border: 0; border-radius: 6px; min-height: 32px; padding: 4px 14px; font: inherit; font-size: 14px;
  cursor: pointer; background: transparent; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tabs button[aria-selected="true"] { background: var(--btn); color: #fff; }
.tabs .live { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.page { display: flex; flex-direction: column; gap: 28px; }
.page[hidden], .tools > span[hidden] { display: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card.session { background: #1a1e26; border-color: #2f3644; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.session .who { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: var(--ok); }
.session .timer { font-size: 44px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: #b8c0c9; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.danger { border-color: #5b2a2a; background: #2a1717; color: #ff8a8a; }
.btn.small { min-height: 36px; padding: 0 10px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  white-space: nowrap; justify-self: start; background: rgba(154, 163, 173, .14); color: #b8c0c9; }
.chip.online { background: rgba(95, 211, 168, .12); color: var(--ok); }
.chip.allowed { background: rgba(78, 161, 255, .14); color: #7ab8ff; }
.chip.closed { background: rgba(255, 107, 107, .14); color: #ff8a8a; }
.chip.soon { background: rgba(255, 159, 67, .14); color: #ffb86b; }
.usage { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.usage div { height: 100%; background: var(--accent); }
.usage div.soon { background: var(--warm); }
.ctable { border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
.crow { display: grid; grid-template-columns: minmax(110px, 1fr) 170px minmax(180px, 1.6fr) minmax(140px, 1fr) 200px;
  gap: 12px; padding: 12px 16px; align-items: center; border-bottom: 1px solid #1d2129; min-width: 860px; }
.crow:last-child { border-bottom: 0; }
@media (max-width: 720px) {  /* rows become cards on a phone */
  .crow { grid-template-columns: 1fr auto; min-width: 0; gap: 8px 12px; }
  .crow.head { display: none; }
  .crow .rule, .crow .used, .crow .actions { grid-column: 1 / -1; }
  .crow .actions { justify-content: flex-start; }
}
.crow.head { font-size: 12px; color: var(--faint); padding: 10px 16px; border-bottom-color: var(--line); }
.crow .cn { font-size: 14px; font-weight: 600; }
.crow .rule { font-size: 13px; color: #b8c0c9; }
.crow .used { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--faint); }
.crow .actions { justify-content: flex-end; gap: 6px; }
.lanes { display: flex; flex-direction: column; gap: 10px; }
.lane { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: center; font-size: 13px; color: #b8c0c9; }
.lane .name { font-size: 13px; }
.track { position: relative; height: 18px; background: #12151b; border-radius: 4px; overflow: hidden; }
.track i { position: absolute; top: 0; bottom: 0; }
.track .win { background: rgba(78, 161, 255, .14); }
.track .use { top: 4px; bottom: 4px; border-radius: 3px; background: var(--accent); min-width: 3px; }
.rulerow input { width: 70px; text-align: center; font-variant-numeric: tabular-nums; }
.rulerow input:invalid { border-color: var(--hot); }
.track .use.live { background: var(--warm); }
.track .nowline { width: 2px; background: #e6e8eb; opacity: .7; }
.hours { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); }
.events { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #b8c0c9; }
.events .ev { display: grid; grid-template-columns: 76px 1fr; gap: 8px; }
.events .ev time { color: var(--faint); font-variant-numeric: tabular-nums; }
.events .denied { color: #ff8a8a; }
.notice { background: #1b2433; border: 1px solid #2c3d57; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #c7d3e3; }
.notice.bad { background: #2a1717; border-color: #5b2a2a; color: #ffb0b0; }
.notice code { background: rgba(0, 0, 0, .3); padding: 1px 6px; border-radius: 4px; }
.two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }

/* Access dialog */
#policy { width: min(860px, calc(100vw - 32px)); }
.pbody { display: flex; flex-direction: column; gap: 18px; }
.pbody h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.rules { display: flex; flex-direction: column; gap: 8px; }
.rulerow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #0f1115; border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; }
.daychips { display: flex; gap: 4px; }
.daychip { width: 34px; height: 34px; border-radius: 6px; border: 0; font: inherit; font-size: 12px; cursor: pointer;
  background: #222731; color: var(--faint); }
.daychip[aria-pressed="true"] { background: var(--accent); color: #0b0d10; font-weight: 600; }
.rulerow input, .limits input { min-height: 38px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  color: var(--text); font: inherit; padding: 0 8px; color-scheme: dark; }
.wgrid { display: grid; grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 3px; touch-action: none; user-select: none; }
.wgrid span { font-size: 10px; color: var(--faint); text-align: center; }
.wgrid .dl { font-size: 12px; color: #b8c0c9; text-align: left; align-self: center; }
.wgrid .cell { height: 24px; border-radius: 3px; background: #222731; cursor: pointer; }
.wgrid .cell.on { background: var(--accent); }
.wgrid .cell.part { background: linear-gradient(90deg, var(--accent) 50%, #222731 50%); }
.limits { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.limits label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #b8c0c9; }
.summary { background: #12151b; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #b8c0c9; }
.dfoot { display: flex; justify-content: flex-end; gap: 8px; }
#pin { width: min(360px, calc(100vw - 32px)); }
#pin form { display: flex; flex-direction: column; gap: 14px; }
#pin input { min-height: 48px; font-size: 22px; text-align: center; letter-spacing: .4em; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px; }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.keypad button { min-height: 52px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 10px;
  font: inherit; font-size: 18px; cursor: pointer; }
.pinerr { font-size: 13px; color: #ff8a8a; min-height: 18px; }
/* Network tab */
.net-note { color: var(--muted); font-size: 13px; margin: 0; max-width: 90ch; }
.net-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 960px) { .net-layout { grid-template-columns: minmax(0, 1fr); } }
.net-canvas { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.net-canvas svg { display: block; width: 100%; min-width: 680px; height: auto; }
.net-node, .net-link { cursor: pointer; outline: none; }
.net-node rect { fill: var(--bg); stroke: currentColor; stroke-width: 1.5; }
.net-node.root rect { stroke-width: 3; }
.net-node:hover rect, .net-node:focus-visible rect, .net-node.sel rect { stroke-width: 4; }
.net-node .ttl { fill: var(--text); font-size: 15px; font-weight: 600; }
.net-node .sub { fill: var(--muted); font-size: 12px; }
.net-node .grp { fill: var(--faint); font-size: 11px; }
.net-node .dot { fill: currentColor; }
.net-node .gly { fill: var(--bg); font-size: 13px; font-weight: 700; text-anchor: middle; }
.net-link .wire { fill: none; stroke: currentColor; stroke-width: 2.5; }
.net-link .hit { fill: none; stroke: transparent; stroke-width: 20; }
.net-link:hover .wire, .net-link:focus-visible .wire, .net-link.sel .wire { stroke-width: 5; }
.net-link .lbg { fill: var(--card); stroke: var(--line); }
.net-link .lbl { fill: var(--text); font-size: 12px; text-anchor: middle; }
.st-up { color: var(--ok); } .st-degraded { color: var(--warm); } .st-down { color: var(--hot); }
.st-idle, .st-unknown { color: var(--faint); }
.net-link.st-degraded .wire { stroke-dasharray: 10 5; }
.net-link.st-down .wire { stroke-dasharray: 3 6; stroke-width: 3; }
.net-link.st-idle .wire, .net-link.st-unknown .wire { stroke-dasharray: 2 7; stroke-linecap: round; }
.net-stale .net-node .dot, .net-stale .net-link .wire { opacity: .45; }
.net-stale .net-node rect { stroke: var(--faint); }
.net-panel { padding: 14px 16px; min-width: 0; }
.net-panel h3 { margin: 0 0 6px; font-size: 15px; color: var(--text); overflow-wrap: anywhere; }
.net-panel .state { font-size: 13px; font-weight: 600; }
.net-panel dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 10px 0 0; font-size: 13px; }
.net-panel dt { color: var(--muted); } .net-panel dd { margin: 0; overflow-wrap: anywhere; }
.net-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.net-legend span { display: inline-flex; align-items: center; gap: 6px; }
.net-legend svg { width: 34px; height: 10px; }
.tabs .alarm { width: 7px; height: 7px; border-radius: 50%; background: var(--hot); }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div class="title"><h1 id="host">hwdash</h1>
      <nav class="tabs" id="tabs" hidden><button data-tab="mon" aria-selected="true"></button><button data-tab="stream" aria-selected="false" hidden></button><button data-tab="net" aria-selected="false" hidden></button></nav>
      <span class="sub" id="sub"></span></div>
    <div class="tools">
      <span class="status" id="status"></span>
      <span class="tools" id="mon-tools"><span class="seg" id="ranges"></span><button class="btn" id="edit-btn" aria-pressed="false"></button></span>
    </div>
  </header>
  <div class="page" id="page-mon">
  <div class="banner" id="banner" hidden>
    <span id="banner-text"></span>
    <div><button class="btn" id="reset-btn"></button><button class="btn primary" id="done-btn"></button></div>
  </div>
  <section id="hero-sec"><h2 id="h-main"></h2><div class="hero-grid" id="hero"></div></section>
  <section id="load-sec"><h2 id="h-load"></h2><div class="load-grid" id="load"></div></section>
  <section id="groups-sec"><h2 id="h-sensors"></h2><div class="groups" id="groups"></div></section>
  <div class="note" id="note"></div>
  </div>
  <div class="page" id="page-stream" hidden></div>
  <div class="page" id="page-net" hidden></div>
</div>

<dialog id="detail">
  <div class="dhead"><h3 id="d-title"></h3><button class="close" id="d-close">×</button></div>
  <div class="chart" id="d-chart"></div>
  <div class="axis" id="d-axis"></div>
  <div class="legend" id="d-legend"></div>
</dialog>

<dialog id="policy">
  <div class="dhead"><h3 id="p-title"></h3><button class="close" id="p-close">×</button></div>
  <div class="pbody" id="p-body"></div>
</dialog>

<dialog id="pin">
  <form id="pin-form" method="dialog">
    <div class="dhead"><h3 id="pin-title"></h3><button class="close" type="button" id="pin-close">×</button></div>
    <span class="sub" id="pin-text"></span>
    <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="32">
    <div class="keypad" id="keypad"></div>
    <span class="pinerr" id="pin-err" role="alert"></span>
    <button class="btn primary" type="submit" id="pin-ok"></button>
  </form>
</dialog>

<script>
// ---- i18n: English by default, Russian for ru-* browsers; ?lang=en|ru overrides ----
const I18N = {
  en: {
    loading: "loading…", customize: "Customize", reset: "Reset all", done: "Done",
    banner: "“Show” hides or restores a tile, “Large” moves it to Overview, an empty name restores the default. Saved on the server for every device. Live updates are paused.",
    main: "Overview", load: "Load", sensors: "Sensors",
    g_cpu: "CPU", g_gpu: "GPU", g_board: "Motherboard", g_memory: "Memory", g_storage: "Storage",
    g_net: "Network", g_fans: "Fans", g_other: "Other",
    l_cpu: "CPU", l_mem: "Memory", l_disk: "Disk", l_gpu: "GPU",
    threads: "{n} threads", ghz: "GHz", gib: "GiB", mib: "MiB", tb: "TB", gb: "GB", mbs: "MB/s", w: "W",
    rpm: "rpm", cache: "cache", rd: "r", wr: "w", pp: " pp",
    ok: "normal", warm: "warm", hot: "hot", min: "min", typ: "typical", max: "max", limit: "limit",
    dev: "{d} vs typical", same: "≈ typical",
    show: "show", large: "large", name: "Tile name",
    note_base: "Typical = median of {span} of collected data (dashed line); the band in Overview is the usual range.",
    note_hidden: "Hidden tiles: {n} — use Customize to bring them back.",
    h: "h", days: "days", up: "up", d: "d",
    updated: "updated {t}", stale: "stale data ({s} s)", offline: "no connection to the server",
    saved: "settings saved", save_fail: "could not save settings",
    confirm_reset: "Restore all tiles, sizes and default names?",
    no_data: "No data yet — history is being collected.", value: "value",

const LANG = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && I18N[q]) return q;
  return (navigator.language || "en").toLowerCase().startsWith("ru") ? "ru" : "en";
})();
const t = (key, vars = {}) => {
  const s = I18N[LANG][key];
  return typeof s === "string" ? s.replace(/\{(\w+)\}/g, (_, k) => vars[k]) : s;
};
document.documentElement.lang = LANG;

const $ = (id) => document.getElementById(id);
const GROUPS = ["cpu", "gpu", "board", "memory", "storage", "net", "fans", "other"];
const GiB = 1024 ** 3;
let range = "24h", now = null, hist = null, openKey = null, editing = false;
let cfg = { hidden: {}, focus: {}, names: {} };
try { range = localStorage.getItem("hwdash-range") || range; } catch (e) {}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (v, d = 0) => (v == null || Number.isNaN(v) ? "—" : v.toFixed(d));
const gib = (b) => (b / GiB).toFixed(1);
const mbs = (b) => (b / 1e6).toFixed(b < 1e7 ? 1 : 0);
const spanText = (h) => (h < 48 ? `${h} ${t("h")}` : `${Math.round(h / 24)} ${t("days")}`);

// Load cards: value, subtitle, bar, series for the chart and the sparkline scale.
const LOAD = [
  { key: "cpu", name: () => t("l_cpu"), unit: () => "%",
    sub: (v, i) => `${t("threads", { n: i.cpu_threads })}${v.cpu_mhz ? ` · ${fmt(v.cpu_mhz / 1000, 1)} ${t("ghz")}` : ""}`,
    big: (v) => `${fmt(v.cpu)}%`, extra: (v) => `load ${fmt(v.load1, 2)}`, pct: (v) => v.cpu, lim: () => [0, 100] },
  { key: "mem_used", name: () => t("l_mem"), scale: 1 / GiB, unit: () => ` ${t("gib")}`,
    sub: (v) => `${gib(v.mem_total)} ${t("gib")}`, big: (v) => `${gib(v.mem_used)} ${t("gib")}`,
    extra: (v) => `${t("cache")} ${gib(v.mem_cache)} · swap ${gib(v.swap_used)}/${gib(v.swap_total)}`,
    pct: (v) => (100 * v.mem_used) / v.mem_total, lim: (v) => [0, v.mem_total] },
  { key: "disk_io", name: () => t("l_disk"), scale: 1e-6, unit: () => ` ${t("mbs")}`,
    sub: (v, i) => `${i.disk ? i.disk + " · " : ""}${(v.disk_total / 1e12).toFixed(1)} ${t("tb")}`,
    big: (v) => `${(v.disk_used / 1e9).toFixed(0)} ${t("gb")}`,
    extra: (v) => `${t("rd")} ${mbs(v.disk_r ?? 0)} · ${t("wr")} ${mbs(v.disk_w ?? 0)} ${t("mbs")}`,
    pct: (v) => (100 * v.disk_used) / v.disk_total },
  { key: "gpu_util", name: () => t("l_gpu"), unit: () => "%",
    sub: (v, i) => i.gpu_name || "", big: (v) => `${fmt(v.gpu_util)}%`,
    extra: (v) => [
      v.gpu_mem_total ? `VRAM ${v.gpu_mem >= 1024 ? fmt(v.gpu_mem / 1024, 1) + " " + t("gib") : fmt(v.gpu_mem) + " " + t("mib")} / ${fmt(v.gpu_mem_total / 1024)} ${t("gib")}` : "",
      v.gpu_w != null ? `${fmt(v.gpu_w, 1)} ${t("w")}` : "",
    ].filter(Boolean).join(" · "),
    pct: (v) => v.gpu_util, lim: () => [0, 100] },
];

const titleOf = (key, fallback) => cfg.names[key] || fallback;
const isHidden = (key, def = false) => cfg.hidden[key] ?? def;
const isFocus = (key) => cfg.focus[key] ?? now.meta[key]?.focus ?? false;
const seriesOf = (key) => hist?.series[key] || [];
const baseOf = (key) => hist?.base?.keys[key];

const yOf = (v, h, lo, hi) => h - 2 - ((v - lo) / (hi - lo || 1)) * (h - 4);

// SVG path for a series with gaps on null; returns the line and the area.
function paths(vals, w, h, lo, hi) {
  let line = "", area = "", seg = [];
  const n = Math.max(vals.length - 1, 1);
  const flush = () => {
    if (!seg.length) return;
    const d = seg.map(([x, y], i) => `${i ? "L" : "M"}${x} ${y}`).join(" ");
    line += d + " ";
    area += `${d} L${seg[seg.length - 1][0]} ${h} L${seg[0][0]} ${h} Z `;
    seg = [];
  };
  vals.forEach((v, i) => {
    if (v == null) return flush();
    seg.push([((i / n) * w).toFixed(1), yOf(v, h, lo, hi).toFixed(1)]);
  });
  flush();
  return { line, area };
}

// Sparkline; the baseline (median) is dashed, band adds the p10–p90 range.
function spark(vals, h, color, lim, base, band = false) {
  const nums = vals.filter((v) => v != null);
  if (!nums.length) return `<svg class="spark" viewBox="0 0 200 ${h}" aria-hidden="true"></svg>`;
  const extra = base ? (band ? [base.p10, base.p90] : [base.p50]) : [];
  const [lo, hi] = lim || [Math.min(...nums, ...extra), Math.max(...nums, ...extra)];
  const p = paths(vals, 200, h, lo, hi);
  let marks = "";
  if (base) {
    const by = yOf(base.p50, h, lo, hi).toFixed(1);
    if (band) {
      const top = yOf(base.p90, h, lo, hi), bottom = yOf(base.p10, h, lo, hi);
      marks += `<rect x="0" width="200" y="${top.toFixed(1)}" height="${Math.max(1, bottom - top).toFixed(1)}" fill="#c9d1db" fill-opacity="0.045"/>`;
    }
    marks += `<line x1="0" x2="200" y1="${by}" y2="${by}" stroke="#c9d1db" stroke-opacity="0.55" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`;
  }
  return `<svg class="spark" viewBox="0 0 200 ${h}" preserveAspectRatio="none" aria-hidden="true">
    ${marks}<path d="${p.area}" fill="${color}" fill-opacity="0.12"/>
    <path d="${p.line}" fill="none" stroke="${color}" stroke-width="${band ? 2 : 1.5}" vector-effect="non-scaling-stroke"/></svg>`;
}

// Deviation from typical; highlighted when above the usual range (p90).
function deviation(v, base, unit, d = 0) {
  if (!base || v == null || Number.isNaN(v)) return "";
  const diff = v - base.p50;
  if (Math.abs(diff) < 0.5 * 10 ** -d) return `<span class="dev">${t("same")}</span>`;
  const txt = `${diff > 0 ? "+" : "−"}${Math.abs(diff).toFixed(d)}${unit}`;
  return `<span class="dev ${v > base.p90 ? "up" : ""}">${t("dev", { d: txt })}</span>`;
}

function editBlock(key, title, hiddenDef, withFocus) {
  return `<div class="edit">
    <div class="checks">
      <label><input type="checkbox" data-hide="${esc(key)}" ${isHidden(key, hiddenDef) ? "" : "checked"}> ${t("show")}</label>
      ${withFocus ? `<label><input type="checkbox" data-focus="${esc(key)}" ${isFocus(key) ? "checked" : ""}> ${t("large")}</label>` : ""}
    </div>
    <input type="text" data-name="${esc(key)}" value="${esc(cfg.names[key] || "")}" placeholder="${esc(title)}" aria-label="${t("name")}" maxlength="60">
    <span class="hint" title="${esc(key)}">${esc(key)}</span>
  </div>`;
}

function heat(m, v) {
  if (m.kind !== "temp") return "";
  return v >= m.warn ? "hot" : v >= m.warn * 0.9 ? "warm" : "";
}

// One function for both sensor tile sizes: standard and hero.
function sensorTile(key, m, v, hero) {
  const isTemp = m.kind === "temp", base = baseOf(key), title = titleOf(key, m.title);
  const cls = heat(m, v), off = isHidden(key, m.hidden) ? " off" : "";
  const src = key.slice(2).split("/")[0].replace(/_.*/, "");
  const tag = editing ? "div" : "button";
  const right = hero && isTemp ? `<span class="pill">${t(cls || "ok")}</span>` : `<span class="src">${esc(src)}</span>`;
  return `<${tag} class="tile${hero ? " hero" : ""} ${cls}${off}" data-key="${esc(key)}">
    <div class="row"><span class="name" title="${esc(title)}">${esc(title)}</span>${right}</div>
    <div class="val"><span><span class="big">${fmt(v, isTemp ? 1 : 0)}</span><span class="unit">${isTemp ? "°C" : t("rpm")}</span></span>${deviation(v, base, isTemp ? "°" : "", 0)}</div>
    ${spark(seriesOf(key), hero ? 84 : 36, cls ? "#ff9f43" : "#4ea1ff", null, base, hero)}
    <div class="row mm"><span>${t("min")} ${fmt(hist?.min[key])}</span><span>${t("typ")} ${fmt(base?.p50)}</span><span>${t("max")} ${fmt(hist?.max[key])}</span>${hero && isTemp ? `<span>${t("limit")} ${m.warn}</span>` : ""}</div>
    ${editing ? editBlock(key, m.title, m.hidden, true) : ""}
  </${tag}>`;
}

function loadTile(c, v, info) {
  const pct = Math.max(0, Math.min(100, c.pct(v) || 0)), base = baseOf(c.key);
  const off = isHidden(c.key) ? " off" : "", tag = editing ? "div" : "button";
  const scale = c.scale ?? 1, dec = c.key === "mem_used" ? 1 : 0, unit = c.unit();
  const devBase = base && { p50: base.p50 * scale, p90: base.p90 * scale };
  return `<${tag} class="tile load${off}" data-key="${c.key}">
    <div class="row"><span class="cname">${esc(titleOf(c.key, c.name()))}</span><span class="src">${esc(c.sub(v, info))}</span></div>
    <div class="row"><span class="cbig">${c.big(v)}</span><span class="extra">${esc(c.extra(v))}</span></div>
    <div class="bar"><div style="width:${Math.max(pct, 1).toFixed(1)}%"></div></div>
    ${spark(seriesOf(c.key), 44, "#4ea1ff", c.lim?.(v), base)}
    <div class="row mm"><span>${t("typ")} ${base ? (base.p50 * scale).toFixed(dec) + unit : "—"}</span>${deviation(v[c.key] == null ? null : v[c.key] * scale, devBase, unit === "%" ? t("pp") : unit, dec)}</div>
    ${editing ? editBlock(c.key, c.name(), false, false) : ""}
  </${tag}>`;
}

function render() {
  if (!now) return;
  const v = now.values, info = now.info, meta = now.meta;
  $("host").textContent = info.title;
  document.title = `${info.title} · hwdash`;
  const up = info.uptime, d = Math.floor(up / 86400), h = Math.floor((up % 86400) / 3600);
  $("sub").textContent = [info.cpu_model?.replace(/ \d+-Core Processor/, ""), info.gpu_name,
    `${t("up")} ${d ? d + " " + t("d") + " " : ""}${h} ${t("h")}`].filter(Boolean).join(" · ");

  const byOrder = (a, b) => meta[a].order - meta[b].order || a.localeCompare(b, "en", { numeric: true });
  const sensors = Object.keys(meta).filter((k) => k in v && (editing || !isHidden(k, meta[k].hidden))).sort(byOrder);

  const hero = sensors.filter(isFocus);
  $("hero").innerHTML = hero.map((k) => sensorTile(k, meta[k], v[k], true)).join("");
  $("hero-sec").hidden = !hero.length;

  const loads = LOAD.filter((c) => (c.key !== "gpu_util" || "gpu_util" in v) && (editing || !isHidden(c.key)));
  $("load").innerHTML = loads.map((c) => loadTile(c, v, info)).join("");
  $("load-sec").hidden = !loads.length;

  const rest = sensors.filter((k) => !isFocus(k));
  $("groups").innerHTML = GROUPS.map((id) => {
    const keys = rest.filter((k) => (GROUPS.includes(meta[k].group) ? meta[k].group : "other") === id);
    if (!keys.length) return "";
    const n = keys.length;
    return `<div class="group" style="flex: ${n} 1 calc(${n} * 170px + ${n - 1} * 12px)">
      <h3>${t("g_" + id)}</h3><div class="gtiles">${keys.map((k) => sensorTile(k, meta[k], v[k], false)).join("")}</div></div>`;
  }).join("");
  $("groups-sec").hidden = !rest.length;

  const nHidden = Object.keys(meta).filter((k) => k in v && isHidden(k, meta[k].hidden)).length + LOAD.filter((c) => isHidden(c.key)).length;
  const span = hist?.base?.span_h;
  $("note").textContent = [
    span ? t("note_base", { span: spanText(span) }) : "",
    !editing && nHidden ? t("note_hidden", { n: nHidden }) : "",
  ].join(" ");
  if (openKey && $("detail").open) drawDetail();
}

// Large chart: usual range band p10–p90, dashed median, hover tooltip.
function drawDetail() {
  const key = openKey, W = 900, H = 300;
  const load = LOAD.find((c) => c.key === key);
  const m = now.meta[key];
  const scale = load?.scale ?? 1;
  const unit = load ? load.unit() : m.kind === "temp" ? " °C" : ` ${t("rpm")}`;
  const vals = seriesOf(key).map((x) => (x == null ? null : x * scale));
  const nums = vals.filter((x) => x != null);
  const b = baseOf(key), base = b && { p10: b.p10 * scale, p50: b.p50 * scale, p90: b.p90 * scale };
  $("d-title").textContent = `${titleOf(key, load ? load.name() : m.title)} · ${t("ranges")[range]}`;
  if (!nums.length) {
    $("d-chart").innerHTML = `<p class="sub">${t("no_data")}</p>`;
    $("d-axis").innerHTML = $("d-legend").innerHTML = "";
    return;
  }
  let lo = Math.min(...nums, ...(base ? [base.p10] : [])), hi = Math.max(...nums, ...(base ? [base.p90] : []));
  const pad = (hi - lo) * 0.1 || 1; lo = Math.max(0, lo - pad); hi += pad;
  const p = paths(vals, W, H, lo, hi);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => ({ y: H - 2 - f * (H - 4), v: lo + f * (hi - lo) }));
  const dec = hi - lo < 10 ? 1 : 0;
  const band = base ? `<rect x="0" width="${W}" y="${yOf(base.p90, H, lo, hi)}" height="${Math.max(1, yOf(base.p10, H, lo, hi) - yOf(base.p90, H, lo, hi))}" fill="#c9d1db" fill-opacity="0.08"/>
    <line x1="0" x2="${W}" y1="${yOf(base.p50, H, lo, hi)}" y2="${yOf(base.p50, H, lo, hi)}" stroke="#c9d1db" stroke-opacity="0.7" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>` : "";
  $("d-chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${t("chart")}">
    ${ticks.map((tk) => `<line x1="0" x2="${W}" y1="${tk.y}" y2="${tk.y}" stroke="#262b35" vector-effect="non-scaling-stroke"/>`).join("")}
    ${band}
    <path d="${p.area}" fill="#4ea1ff" fill-opacity="0.12"/>
    <path d="${p.line}" fill="none" stroke="#4ea1ff" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <line id="d-cross" x1="0" x2="0" y1="0" y2="${H}" stroke="#9aa3ad" vector-effect="non-scaling-stroke" visibility="hidden"/>
    </svg>${ticks.map((tk) => `<span class="mm" style="position:absolute;left:4px;top:${(tk.y / H) * 300 - 14}px">${tk.v.toFixed(dec)}</span>`).join("")}
    <div class="tip" id="d-tip"></div>`;
  const t0 = hist.start, step = hist.step, n = vals.length;
  const long = range === "7d" || range === "48h";
  const clock = (ts) => new Date(ts * 1000).toLocaleString(LANG, long ? { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" } : { hour: "2-digit", minute: "2-digit" });
  $("d-axis").innerHTML = [0, 0.25, 0.5, 0.75, 1].map((f) => `<span>${clock(t0 + Math.round(f * (n - 1)) * step)}</span>`).join("");
  $("d-legend").innerHTML = base ? `<span><i class="sw"></i>${t("value")}</span>
    <span><i class="sw base"></i>${t("leg_typ", { v: base.p50.toFixed(dec + 1) + unit, span: spanText(hist.base.span_h) })}</span>
    <span><i class="sw band"></i>${t("leg_band", { a: base.p10.toFixed(dec), b: base.p90.toFixed(dec) + unit })}</span>`
    : `<span>${t("no_base")}</span>`;
  const svg = $("d-chart").querySelector("svg"), tip = $("d-tip"), cross = $("d-cross");
  svg.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const i = Math.round(f * (n - 1)), x = (i / (n - 1)) * W;
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    tip.style.display = "block";
    tip.textContent = `${clock(t0 + i * step)} · ${vals[i] == null ? "—" : vals[i].toFixed(dec + 1) + unit}`;
    tip.style.left = Math.min(r.width - tip.offsetWidth, Math.max(0, f * r.width - tip.offsetWidth / 2)) + "px";
  });
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });
}

function setStatus(text, bad = false) {
  $("status").textContent = text;
  $("status").classList.toggle("bad", bad);
}

async function loadNow() {
  try {
    now = await (await fetch("api/now")).json();
  } catch (e) {
    setStatus(t("offline"), true);
    return;
  }
  const age = Math.round(Date.now() / 1000 - now.ts);
  if (age > 3 * now.info.step) setStatus(t("stale", { s: age }), true);
  else setStatus(t("updated", { t: new Date(now.ts * 1000).toLocaleTimeString(LANG) }));
  if (!editing) render();  // re-rendering while customizing would reset the inputs
  if (typeof onNowLoaded === "function") onNowLoaded();
}

async function loadHist() {
  try { hist = await (await fetch(`api/history?range=${range}`)).json(); } catch (e) { return; }
  if (!editing) render();
}

let saveTimer = null;
function saveConfig() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch("api/config", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cfg) });
      if (!r.ok) throw new Error(r.status);
      setStatus(t("saved"));
    } catch (e) {
      setStatus(t("save_fail"), true);
    }
  }, 300);
}

function setEditing(on) {
  editing = on;
  $("wrap").classList.toggle("editing", on);
  $("banner").hidden = !on;
  $("edit-btn").setAttribute("aria-pressed", on);
  render();
}

function setRange(r) {
  range = r;
  try { localStorage.setItem("hwdash-range", r); } catch (e) {}
  document.querySelectorAll("#ranges button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.r === r));
  loadHist();
}

// Static texts
$("ranges").innerHTML = Object.entries(t("ranges")).map(([r, label]) => `<button data-r="${r}">${label}</button>`).join("");
$("status").textContent = t("loading");
$("edit-btn").textContent = t("customize");
$("banner-text").textContent = t("banner");
$("reset-btn").textContent = t("reset");
$("done-btn").textContent = t("done");
$("h-main").textContent = t("main");
$("h-load").textContent = t("load");
$("h-sensors").textContent = t("sensors");
$("d-close").setAttribute("aria-label", t("close"));

$("ranges").addEventListener("click", (e) => e.target.dataset.r && setRange(e.target.dataset.r));
$("edit-btn").addEventListener("click", () => setEditing(!editing));
$("done-btn").addEventListener("click", () => setEditing(false));
$("d-close").addEventListener("click", () => $("detail").close());
$("reset-btn").addEventListener("click", () => {
  if (!confirm(t("confirm_reset"))) return;
  cfg = { hidden: {}, focus: {}, names: {} };
  saveConfig();
  render();
});
document.addEventListener("click", (e) => {
  const tile = e.target.closest(".tile");
  if (!tile || editing) return;
  openKey = tile.dataset.key;
  $("detail").showModal();
  drawDetail();
});
document.addEventListener("change", (e) => {

let stream = null, tab = "mon", token = null, pending = null, draft = null, draftUuid = null, view = "rules", rules = [];
let streamAt = 0;
try { token = sessionStorage.getItem("hwdash-token"); } catch (e) {}

const hm = (ts) => new Date(ts * 1000).toLocaleTimeString(LANG, { hour: "2-digit", minute: "2-digit" });
const when = (ts) => {
  const d = new Date(ts * 1000), today = new Date();
  if (d.toDateString() === today.toDateString()) return hm(ts);
  return `${t("days")[(d.getDay() + 6) % 7]} ${hm(ts)}`;
};
const dur = (s) => {
  const m = Math.max(0, Math.round(s / 60));
  return m >= 60 ? `${Math.floor(m / 60)} ${t("h")} ${String(m % 60).padStart(2, "0")} ${t("min_s")}` : `${m} ${t("min_s")}`;
};
const clockOf = (s) => {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return `${h ? h + ":" : ""}${String(m).padStart(h ? 2 : 1, "0")}:${String(sec).padStart(2, "0")}`;
};
const mm = (m) => (m >= 1440 ? "24:00" : `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`);
const TIME_RE = "([01]?\\d|2[0-3]):[0-5]\\d|24:00";  // 24-hour clock whatever the browser locale
const toMin = (v) => {
  if (!new RegExp(`^(${TIME_RE})$`).test(v.trim())) return null;
  const [h, m] = v.trim().split(":").map(Number);
  return h * 60 + m;
};

function dayRange(days) {
  const names = t("days"), out = [];
  for (let i = 0; i < days.length; i++) {
    let j = i;
    while (j + 1 < days.length && days[j + 1] === days[j] + 1) j++;
    out.push(j - i >= 2 ? `${names[days[i]]}–${names[days[j]]}` : days.slice(i, j + 1).map((d) => names[d]).join(", "));
    i = j;
  }
  return out.join(", ");
}

// Groups identical windows across days: [{days: [0..4], a: 960, b: 1200}, ...]
function rulesFromDays(days) {
  const map = new Map();
  days.forEach((wins, d) => wins.forEach(([a, b]) => {
    const k = `${a}-${b}`;
    if (!map.has(k)) map.set(k, { days: [], a, b });
    map.get(k).days.push(d);
  }));
  return [...map.values()].sort((x, y) => x.days[0] - y.days[0] || x.a - y.a);
}
function daysFromRules(list) {
  const days = [[], [], [], [], [], [], []];
  list.forEach((r) => r.a < r.b && r.days.forEach((d) => days[d].push([r.a, r.b])));
  return days.map((w) => w.sort((x, y) => x[0] - y[0]));
}

function ruleSummary(p) {
  if (p.mode === "unmanaged") return "—";
  if (p.mode === "always") return t("r_always");
  if (p.mode === "blocked") return t("r_blocked");
  const groups = new Map();
  p.days.forEach((wins, d) => {
    if (!wins.length) return;
    const k = wins.map(([a, b]) => `${mm(a)}–${mm(b)}`).join(", ");
    groups.set(k, [...(groups.get(k) || []), d]);
  });
  const parts = [...groups].map(([w, ds]) => `${dayRange(ds)} ${w}`);
  const lw = p.limit_weekday, le = p.limit_weekend;
  if (lw != null || le != null) {
    const l = lw === le ? `${lw} ${t("min_s")}` : `${lw ?? "∞"}/${le ?? "∞"} ${t("min_s")}`;
    parts.push(t("r_limit", { l }));
  }
  return parts.length ? parts.join(" · ") : t("r_none");
}

function statusOf(c) {
  const ev = c.eval;
  if (c.online) return ["online", t("st_online")];
  if (!ev.managed) return ["", t("st_unmanaged")];
  if (ev.allowed) {
    if (ev.reason === "always") return ["", t("st_always")];
    const soon = ev.ends_at && ev.ends_at - stream.now < 900;
    return [soon ? "soon" : "allowed", ev.ends_at ? t("st_until", { t: hm(ev.ends_at) }) : t("st_allowed")];
  }
  if (ev.reason === "paused") return ["closed", t("st_paused", { t: when(ev.opens_at) })];
  if (ev.reason === "limit") return ["closed", t("st_limit")];
  if (ev.reason === "blocked") return ["closed", t("st_blocked")];
  return ["closed", ev.opens_at ? t("st_closed_until", { t: when(ev.opens_at) }) : t("st_closed")];
}

function usageText(c) {
  const ev = c.eval;
  return ev.limit_s != null ? t("s_today", { u: dur(ev.used_s), l: dur(ev.limit_s) }) : dur(ev.used_s);
}

function actionButtons(c, inSession) {
  const ev = c.eval, b = (action, label, cls = "", minutes = "") =>
    `<button class="btn ${inSession ? "" : "small"} ${cls}" data-act="${action}" data-uuid="${esc(c.uuid)}" data-min="${minutes}">${label}</button>`;
  const out = [];
  if (ev.managed && ev.reason !== "always") {
    if (ev.allowed) out.push(b("extend", t("a_plus15"), "", 15));
    else out.push(b("extend", t("a_open"), "", 60));
    if (inSession) out.push(b("extend", t("a_plus60"), "", 60));
  }
  if (inSession) out.push(b("end", t("a_end"), "danger"));
  if (inSession && ev.managed) out.push(b("pause_morning", t("a_pause")));
  if (!inSession) out.push(`<button class="btn small" data-rules="${esc(c.uuid)}">${t("a_rules")}</button>`);
  return out.join("");
}

function sessionCard() {
  const s = stream.session;
  if (!s) {
    const last = stream.launches.find((l) => !l.denied && l.end_ts);
    return `<div class="card session"><div class="who"><span class="dot"></span>${t("s_none")}</div>
      ${last ? `<div class="meta">${esc(t("s_last", { name: last.name || "?", app: last.app || "?", from: hm(last.ts), to: hm(last.end_ts) }))}</div>` : ""}</div>`;
  }
  const c = stream.clients.find((x) => x.uuid === s.uuid);
  const ev = c ? c.eval : null;
  const left = ev && ev.managed && ev.ends_at ? ev.ends_at - stream.now : null;
  const pct = ev && ev.limit_s ? Math.min(100, (100 * ev.used_s) / ev.limit_s) : null;
  return `<div class="card session">
    <div class="row"><div class="who"><span class="dot ${s.connected ? "on" : ""}"></span>${esc(s.name || t("s_unknown"))}</div>
      ${left != null ? `<span class="chip ${left < 900 ? "soon" : "allowed"}">${t("s_left", { d: dur(left) })}</span>` : ""}</div>
    <div class="val"><span class="timer" id="s-timer" data-since="${s.connected ? s.connected_since : ""}">${s.connected ? clockOf(stream.now - s.connected_since) : "—"}</span>
      <span class="sub">${s.connected ? t("s_since", { t: hm(s.ts || s.connected_since) }) : t("s_disc", { t: hm(s.disconnected_since) })}</span></div>
    <div class="meta">${[s.app, s.width && `${s.width}×${s.height} · ${s.fps} fps`, s.codec && `${s.codec}${s.bitrate ? ` · ${(s.bitrate / 1e6).toFixed(0)} Mbit/s` : ""}`]
      .filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join("")}</div>
    ${pct != null ? `<div class="usage"><div class="${left != null && left < 900 ? "soon" : ""}" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="row mm"><span>${usageText(c)}</span>${ev.ends_at ? `<span>${t("st_until", { t: hm(ev.ends_at) })}</span>` : ""}</div>` : ""}
    ${c ? `<div class="actions">${actionButtons(c, true)}</div>` : ""}
  </div>`;
}

// A game with no stream: waiting for its grace period to end, or simply left running.
function gameCard() {
  const p = stream.game_close, games = stream.games || [];
  if (!games.length || (!p && stream.session?.connected)) return "";
  const names = games.map((g) => g.name || t("g_unknown", { id: g.app_id ?? g.pid })).join(", ");
  const closeBtn = `<button class="btn danger" data-act="close_game" data-uuid="${esc(p?.uuid || "")}">${t("a_close_game")}</button>`;
  if (p && p.term_at) return `<div class="card session"><div class="who"><span class="dot"></span>${t("g_closing")}</div><div class="meta">${esc(names)}</div></div>`;
  if (!p) return `<div class="card session"><div class="who"><span class="dot"></span>${t("g_orphan")}</div><div class="meta">${esc(names)}</div><div class="actions">${closeBtn}</div></div>`;
  const add = (min, label) => `<button class="btn" data-act="extend" data-uuid="${esc(p.uuid)}" data-min="${min}">${label}</button>`;
  return `<div class="card session"><div class="who"><span class="dot"></span>${esc(t("g_wait", { name: p.name || "?" }))}</div>
    <div class="val"><span class="sub">${t("g_closes")}</span><span class="timer" id="g-timer" data-at="${p.close_at}">${clockOf(p.close_at - stream.now)}</span></div>
    <div class="meta">${esc(names)}</div>
    <div class="actions">${add(15, t("a_plus15"))}${add(60, t("a_plus60"))}${closeBtn}</div></div>`;
}

function clientsTable() {
  const rows = stream.clients.map((c) => {
    const [cls, text] = statusOf(c), ev = c.eval;
    const pct = ev.limit_s ? Math.min(100, (100 * ev.used_s) / ev.limit_s) : 0;
    return `<div class="crow"><span class="cn">${esc(c.name)}</span><span class="chip ${cls}">${esc(text)}</span>
      <span class="rule">${esc(ruleSummary(c.policy))}</span>
      <div class="used">${ev.limit_s ? `<div class="usage"><div style="width:${pct.toFixed(1)}%"></div></div>` : ""}<span>${usageText(c)}</span></div>
      <div class="actions">${actionButtons(c, false)}</div></div>`;
  }).join("");
  return `<div class="ctable"><div class="crow head"><span>${t("h_device")}</span><span>${t("h_status")}</span><span>${t("h_rule")}</span><span>${t("h_today")}</span><span></span></div>${rows}</div>`;
}

function dayLanes() {
  const d0 = stream.day_start, pos = (a, b) => `left:${((a - d0) / 864).toFixed(3)}%;width:${(Math.max(0, b - a) / 864).toFixed(3)}%`;
  const lanes = stream.clients.map((c) => `<div class="lane"><span class="name">${esc(c.name)}</span><div class="track">
      ${c.windows.map(([a, b]) => `<i class="win" style="${pos(a, b)}"></i>`).join("")}
      ${c.usage.map(([a, b]) => `<i class="use ${c.online && Math.abs(b - stream.now) < 30 ? "live" : ""}" style="${pos(a, b)}"></i>`).join("")}
      <i class="nowline" style="left:${((stream.now - d0) / 864).toFixed(3)}%"></i></div></div>`).join("");
  return `<div class="card lanes">${lanes}<div class="lane"><span></span><div class="hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div></div></div>`;
}

function eventsList() {
  const names = Object.fromEntries(stream.clients.map((c) => [c.uuid, c.name]));
  const why = (r) => t("why_" + r) || r;
  const evs = [
    ...stream.launches.map((l) => ({ ts: l.ts, text: `${l.name || "?"} — ${l.app || "?"}${l.denied ? " · " + t("ev_denied", { r: why(l.reason) }) : ""}`, bad: l.denied })),
    ...stream.actions.map((a) => {
      const key = { enable: "ev_enable", disable: "ev_disable", close: "ev_close", warn: "ev_warn", extend: "ev_extend",
        pause_today: "ev_pause", pause_morning: "ev_pause", policy: "ev_policy", end: "ev_end", clear: "ev_clear",
        game_wait: "ev_game_wait", game_keep: "ev_game_keep", game_term: "ev_game_term", game_closed: "ev_game_closed",
        game_gone: "ev_game_gone", game_failed: "ev_game_failed" }[a.action];
      return { ts: a.ts, text: `${names[a.uuid] || "?"} — ${key ? t(key, { d: a.detail }) : a.action}`, bad: ["close", "disable", "game_wait", "game_term", "game_failed"].includes(a.action) };
    }),
  ].sort((a, b) => b.ts - a.ts).slice(0, 20);
  return `<div class="card events">${evs.length ? evs.map((e) => `<div class="ev"><time>${hm(e.ts)}</time><span class="${e.bad ? "denied" : ""}">${esc(e.text)}</span></div>`).join("") : t("s_ev_none")}</div>`;
}

function renderStream() {
  const live = stream?.session?.connected;
  $("tabs").querySelector('[data-tab="stream"]').innerHTML = `${t("tab_stream")}${live ? '<i class="live"></i>' : ""}`;
  if (tab !== "stream" || !stream) return;
  const notices = [
    !stream.available ? `<div class="notice bad">${esc(t("s_unavailable", { e: stream.error }))}</div>` : "",
    !stream.pin_set ? `<div class="notice">${t("s_nopin", { cmd: "<code>python3 hwdash.py set-pin</code>" })}</div>` : "",
  ].join("");
  $("page-stream").innerHTML = `${notices}${gameCard()}${sessionCard()}
    <section><h2>${t("s_clients")}</h2>${clientsTable()}</section>
    <div class="two">
      <section><div class="row"><h2>${t("s_day")}</h2><span class="mm">${t("s_day_hint")}</span></div>${dayLanes()}</section>
      <section><h2>${t("s_events")}</h2>${eventsList()}</section>
    </div>`;
}

async function loadStream() {
  try {
    const r = await fetch("api/stream", { headers: token ? { "X-Hwdash-Token": token } : {} });
    stream = await r.json();
    streamAt = Date.now();
  } catch (e) { return; }
  if (token && !stream.authorized) saveToken(null);
  renderStream();
}

function saveToken(v) {
  token = v;
  try { v ? sessionStorage.setItem("hwdash-token", v) : sessionStorage.removeItem("hwdash-token"); } catch (e) {}
}

async function send(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-Hwdash-Token": token || "" }, body: JSON.stringify(body) });
  if (r.status === 401) { saveToken(null); throw new Error("auth"); }
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.status);
  stream = data;
  renderStream();
}

// Runs fn now when unlocked, or after the PIN dialog succeeds.
function withPin(fn) {
  if (!stream.pin_set) { alert(t("pin_none")); return; }
  if (stream.authorized && token) {
    fn().catch((e) => (e.message === "auth" ? withPin(fn) : alert(e.message)));
    return;
  }
  pending = fn;
  $("pin-input").value = "";
  $("pin-err").textContent = "";
  $("pin").showModal();
  $("pin-input").focus();
}

$("pin-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("api/stream/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: $("pin-input").value }) });
  const data = await r.json();
  if (!r.ok) {
    $("pin-err").textContent = data.error === "no_pin" ? t("pin_none") : data.wait ? t("pin_wait", { s: data.wait }) : t("pin_bad");
    $("pin-input").value = "";
    return;
  }
  saveToken(data.token);
  stream.authorized = true;
  $("pin").close();
  const fn = pending;
  pending = null;
  if (fn) fn().catch((err) => alert(err.message));
});
$("keypad").innerHTML = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"]
  .map((k) => (k ? `<button type="button" data-key="${k}">${k}</button>` : "<span></span>")).join("");
$("keypad").addEventListener("click", (e) => {
  const k = e.target.dataset.key;
  if (!k) return;
  const inp = $("pin-input");
  inp.value = k === "⌫" ? inp.value.slice(0, -1) : inp.value + k;
});
$("pin-close").addEventListener("click", () => { pending = null; $("pin").close(); });

// ---- access dialog: mode, rules or week grid, limits ----
function openPolicy(uuid) {
  const c = stream.clients.find((x) => x.uuid === uuid);
  draftUuid = uuid;
  draft = JSON.parse(JSON.stringify({ mode: c.policy.mode, days: c.policy.days, limit_weekday: c.policy.limit_weekday, limit_weekend: c.policy.limit_weekend }));
  if (draft.mode === "unmanaged" && !draft.days.some((d) => d.length)) draft.days = [...Array(5).fill([[960, 1200]]), [[600, 1260]], [[600, 1260]]].map((w) => w.map((x) => [...x]));
  rules = rulesFromDays(draft.days);
  view = "rules";
  $("p-title").textContent = t("p_title", { name: c.name });
  renderPolicy();
  $("policy").showModal();
}

function syncDays() { if (view === "rules") draft.days = daysFromRules(rules); }

function renderPolicy() {
  const modes = ["unmanaged", "always", "schedule", "blocked"];
  const seg = (items, cur, attr) => `<div class="seg">${items.map(([v, label]) => `<button type="button" ${attr}="${v}" aria-pressed="${v === cur}">${label}</button>`).join("")}</div>`;
  let editor = "";
  if (draft.mode === "schedule") {
    const names = t("days");
    const list = view === "rules"
      ? `<div class="rules">${rules.map((r, i) => `<div class="rulerow">
          <div class="daychips">${names.map((n, d) => `<button type="button" class="daychip" data-rd="${i}:${d}" aria-pressed="${r.days.includes(d)}">${n}</button>`).join("")}</div>
          <input type="text" inputmode="numeric" maxlength="5" pattern="${TIME_RE}" data-rt="${i}:a" value="${mm(r.a)}" aria-label="${t("p_from")}"> – <input type="text" inputmode="numeric" maxlength="5" pattern="${TIME_RE}" data-rt="${i}:b" value="${mm(r.b)}" aria-label="${t("p_to")}">
          <span style="flex:1"></span><button type="button" class="close" data-rx="${i}" aria-label="${t("p_del")}">×</button></div>`).join("")}
          <button type="button" class="btn" data-radd="1" style="align-self:flex-start">${t("p_add")}</button></div>`
      : gridHtml();
    editor = `<h4>${t("p_windows")}</h4>${seg([["rules", t("v_rules")], ["grid", t("v_grid")]], view, "data-view")}${list}
      <h4>${t("p_limits")}</h4><div class="limits">
        <label>${t("p_weekday")}<input type="number" min="0" max="1440" step="15" data-limit="limit_weekday" value="${draft.limit_weekday ?? ""}"></label>
        <label>${t("p_weekend")}<input type="number" min="0" max="1440" step="15" data-limit="limit_weekend" value="${draft.limit_weekend ?? ""}"></label></div>`;
  }
  $("p-body").innerHTML = `${seg(modes.map((m) => [m, t("m_" + m)]), draft.mode, "data-mode")}${editor}
    <div class="summary" id="p-sum">${policySummary()}</div>
    <div class="dfoot"><button type="button" class="btn" data-pcancel="1">${t("cancel")}</button><button type="button" class="btn primary" data-psave="1">${t("save")}</button></div>`;
}

function gridHtml() {
  const names = t("days");
  const head = `<span></span>${Array.from({ length: 24 }, (_, h) => `<span>${h % 3 ? "" : String(h).padStart(2, "0")}</span>`).join("")}`;
  const rows = draft.days.map((wins, d) => `<span class="dl">${names[d]}</span>${Array.from({ length: 24 }, (_, h) => {
    const cov = wins.reduce((s, [a, b]) => s + Math.max(0, Math.min(b, h * 60 + 60) - Math.max(a, h * 60)), 0);
    return `<div class="cell ${cov >= 60 ? "on" : cov > 0 ? "part" : ""}" data-gc="${d}:${h}"></div>`;
  }).join("")}`).join("");
  return `<div class="wgrid" id="wgrid">${head}${rows}</div><span class="mm">${t("p_grid_hint")}</span>`;
}

function policySummary() {
  if (draft.mode !== "schedule") return t("sum_" + draft.mode);
  syncDays();
  const wd = (new Date().getDay() + 6) % 7, wins = draft.days[wd];
  const lim = wd >= 5 ? draft.limit_weekend : draft.limit_weekday;
  return t("sum_today", { w: wins.length ? wins.map(([a, b]) => `${mm(a)}–${mm(b)}`).join(", ") : t("sum_none_today"),
                          l: lim != null ? t("sum_l", { l: dur(lim * 60) }) : "" });
}

// Week grid painting: press on a cell, drag across others; works with touch.
let painting = null;
function paintAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el || !el.dataset.gc) return;
  const [d, h] = el.dataset.gc.split(":").map(Number);
  const bits = Array.from({ length: 24 }, (_, i) => draft.days[d].reduce((s, [a, b]) => s + Math.max(0, Math.min(b, i * 60 + 60) - Math.max(a, i * 60)), 0) >= 30);
  if (bits[h] === painting) return;
  bits[h] = painting;
  const wins = [];
  bits.forEach((on, i) => { if (on) { if (wins.length && wins[wins.length - 1][1] === i * 60) wins[wins.length - 1][1] += 60; else wins.push([i * 60, i * 60 + 60]); } });
  draft.days[d] = wins;
  el.className = `cell ${painting ? "on" : ""}`;
  $("p-sum").textContent = policySummary();
}
$("p-body").addEventListener("pointerdown", (e) => {
  if (!e.target.dataset.gc) return;
  e.preventDefault();
  painting = !e.target.classList.contains("on");
  paintAt(e.clientX, e.clientY);
});
document.addEventListener("pointermove", (e) => painting !== null && paintAt(e.clientX, e.clientY));
document.addEventListener("pointerup", () => (painting = null));

$("p-body").addEventListener("click", (e) => {
  const ds = e.target.dataset;
  if (ds.mode) { syncDays(); draft.mode = ds.mode; rules = rulesFromDays(draft.days); renderPolicy(); }
  else if (ds.view) { syncDays(); view = ds.view; rules = rulesFromDays(draft.days); renderPolicy(); }
  else if (ds.rd) {
    const [i, d] = ds.rd.split(":").map(Number), r = rules[i];
    r.days = r.days.includes(d) ? r.days.filter((x) => x !== d) : [...r.days, d].sort();
    renderPolicy();
  } else if (ds.rx) { rules.splice(Number(ds.rx), 1); renderPolicy(); }
  else if (ds.radd) { rules.push({ days: [0, 1, 2, 3, 4], a: 960, b: 1200 }); renderPolicy(); }
  else if (ds.pcancel) $("policy").close();
  else if (ds.psave) {
    syncDays();
    const body = { uuid: draftUuid, policy: draft };
    withPin(async () => { await send("PUT", "api/stream/policy", body); $("policy").close(); });
  }
});
$("p-body").addEventListener("change", (e) => {
  const ds = e.target.dataset;
  if (ds.rt) {
    const [i, edge] = ds.rt.split(":"), v = toMin(e.target.value);
    if (v == null) { e.target.value = mm(rules[Number(i)][edge]); return; }
    rules[Number(i)][edge] = v;
    e.target.value = mm(v);
    $("p-sum").textContent = policySummary();
  } else if (ds.limit) {
    const v = e.target.value.trim();
    draft[ds.limit] = v === "" ? null : Math.max(0, Math.min(1440, Math.round(Number(v))));
    $("p-sum").textContent = policySummary();
  }
});
$("p-close").addEventListener("click", () => $("policy").close());

$("page-stream").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.rules) { openPolicy(b.dataset.rules); return; }
  if (!b.dataset.act) return;
  const body = { uuid: b.dataset.uuid, action: b.dataset.act, ...(b.dataset.min ? { minutes: Number(b.dataset.min) } : {}) };
  withPin(() => send("POST", "api/stream/action", body));
});

});
const NET_GLYPH = { up: "✓", degraded: "!", down: "×", idle: "–", unknown: "?" };
const NET_DASH = { up: "", degraded: "10 5", down: "3 6", idle: "2 7", unknown: "2 7" };
const NET_W = 1000, NET_H = 600, NODE_W = 216, NODE_H = 78;
let net = null, netAt = 0, netSel = null, netShape = "";

function netPositions(nodes) {
  // The root sits in the centre, the rest on a ring in config order, clockwise from the top.
  const others = nodes.filter((n) => n.parent), pos = {};
  pos[nodes.find((n) => !n.parent).id] = [NET_W / 2, NET_H / 2];
  others.forEach((n, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / others.length;
    pos[n.id] = [NET_W / 2 + 385 * Math.cos(a), NET_H / 2 + 225 * Math.sin(a)];
  });
  return pos;
}

function netBuild() {
  const nodes = net.nodes, pos = netPositions(nodes);
  const links = nodes.filter((n) => n.parent).map((n) => {
    const [x1, y1] = pos[n.parent], [x2, y2] = pos[n.id], mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const w = n.link.length * 7 + 16;
    const label = n.link ? `<rect class="lbg" x="${mx - w / 2}" y="${my - 12}" width="${w}" height="24" rx="5"/><text class="lbl" x="${mx}" y="${my + 4}">${esc(n.link)}</text>` : "";
    return `<g class="net-link" data-id="${esc(n.id)}" tabindex="0" role="button"><line class="hit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="wire" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>${label}</g>`;
  }).join("");
  const boxes = nodes.map((n) => {
    const [cx, cy] = pos[n.id], x = cx - NODE_W / 2, y = cy - NODE_H / 2;
    return `<g class="net-node ${n.parent ? "" : "root"}" data-id="${esc(n.id)}" tabindex="0" role="button">
      <rect x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}" rx="10"/>
      <text class="grp" x="${x + 14}" y="${y + 20}">${esc(n.group)}</text>
      <text class="ttl" x="${x + 14}" y="${y + 42}">${esc(n.title)}</text>
      <text class="sub" x="${x + 14}" y="${y + 62}">${esc(n.subtitle)}</text>
      <circle class="dot" cx="${x + NODE_W - 18}" cy="${y + 18}" r="10"/><text class="gly" x="${x + NODE_W - 18}" y="${y + 23}"></text></g>`;
  }).join("");
  const legend = ["up", "degraded", "down", "idle", "unknown"].map((s) =>
    `<span class="st-${s}"><svg viewBox="0 0 34 10" aria-hidden="true"><line x1="0" y1="5" x2="34" y2="5" stroke="currentColor" stroke-width="2.5" stroke-dasharray="${NET_DASH[s]}"/></svg><span style="color:var(--muted)">${NET_GLYPH[s]} ${t("n_" + s)}</span></span>`).join("");
  $("page-net").innerHTML = `<p class="net-note">${esc(t("n_note"))}</p><div class="notice" id="net-notice" hidden></div>
    <div class="net-layout"><div class="net-canvas"><svg id="net-map" viewBox="0 0 ${NET_W} ${NET_H}" role="group" aria-label="${esc(t("tab_net"))}">${links}${boxes}</svg></div>
    <div class="card net-panel" id="net-panel" aria-live="polite"></div></div><div class="net-legend">${legend}</div>`;
  const canvas = $("net-map").parentElement;
  canvas.scrollLeft = (canvas.scrollWidth - canvas.clientWidth) / 2;  // phones: start on the hub
  const pick = (e) => {
    const g = e.target.closest(".net-node, .net-link");
    if (g) { netSel = `${g.classList.contains("net-node") ? "node" : "link"}:${g.dataset.id}`; netPaint(); }
  };
  $("net-map").addEventListener("click", pick);
  $("net-map").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(e); } });
}

function netPanel() {
  const box = $("net-panel");
  if (!netSel) { box.innerHTML = `<span class="sub">${esc(t("n_pick"))}</span>`; return; }
  const [kind, id] = netSel.split(":"), n = net.nodes.find((x) => x.id === id);
  if (!n) { netSel = null; netPanel(); return; }
  const parent = net.nodes.find((x) => x.id === n.parent);
  const when = (ts) => ts ? new Date(ts * 1000).toLocaleString(LANG, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
  const dur = (s) => s >= 86400 ? `${Math.floor(s / 86400)} ${t("n_d")} ${Math.floor(s / 3600) % 24} ${t("n_h")}` : s >= 3600 ? `${Math.floor(s / 3600)} ${t("n_h")} ${Math.floor(s / 60) % 60} ${t("n_m")}` : `${Math.floor(s / 60)} ${t("n_m")}`;
  const mbit = (b) => `${(b / 1e6).toFixed(b < 1e7 ? 2 : 1)} ${t("n_mbit")}`;
  const rows = [], tun = n.tunnel, router = n.router;
  if (kind === "node" && n.subtitle) rows.push([t("n_address"), n.subtitle]);
  if (n.group) rows.push([t("n_group"), n.group]);
  if (n.link) rows.push([t("n_type"), n.link]);
  if (kind === "link" && tun) {
    if (tun.handshake_age != null) rows.push([t("n_hs"), t("n_ago", { s: tun.handshake_age })]);
    if (tun.session != null) rows.push([t("n_session"), tun.session ? dur(tun.uptime || 0) : t("n_nosession")]);
    if (tun.rx_bps != null) rows.push([t("n_from"), mbit(tun.rx_bps)], [t("n_to"), mbit(tun.tx_bps)]);
  }
  if (kind === "node" && router) {
    if (router.cpu != null) rows.push([t("n_cpu"), `${router.cpu}%`]);
    if (router.mem != null) rows.push([t("n_mem"), `${router.mem}%`]);
    if (router.uptime != null) rows.push([t("n_up_t"), dur(router.uptime)]);
  }
  if (n.rtt_avg != null) rows.push([t("n_rtt"), `${n.rtt_min.toFixed(1)} / ${n.rtt_avg.toFixed(1)} / ${n.rtt_max.toFixed(1)} ${t("n_ms")}`]);
  if (n.loss != null) rows.push([t("n_loss"), `${Math.round(n.loss)}%`]);
  if (n.since) rows.push([t("n_since"), when(n.since)]);
  if (n.state !== "up" && n.last_ok) rows.push([t("n_last"), when(n.last_ok)]);
  if (n.ping) rows.push([t("n_target"), t("n_ping", { t: n.ping })]);
  const why = n.blocked ? t("n_blocked") : n.ping ? "" : t("n_noprobe");
  const shown = kind === "link" ? n.link_state : n.state;
  box.innerHTML = `<h3>${esc(kind === "link" && parent ? t("n_link", { p: parent.title }) + " · " + n.title : n.title)}</h3>
    <span class="state st-${shown}">${NET_GLYPH[shown]} ${esc(t("n_" + shown))}</span>
    ${why ? `<p class="sub" style="margin:8px 0 0">${esc(why)}</p>` : ""}
    <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${tun ? `<p class="sub" style="margin:10px 0 0">${esc(t("n_src"))}</p>` : ""}`;
}

function netPaint() {
  // Stale when the server stopped checking, or when this page stopped reaching the server.
  const limit = (net?.interval || 15) * 3;
  const stale = !net || !net.ts || net.now - net.ts > limit || Date.now() - netAt > limit * 1000;
  const down = net?.nodes.some((n) => n.state === "down" || n.link_state === "down");
  $("tabs").querySelector('[data-tab="net"]').innerHTML = `${t("tab_net")}${down ? '<i class="alarm"></i>' : ""}`;
  if (tab !== "net" || !net) return;
  const shape = JSON.stringify(net.nodes.map((n) => [n.id, n.parent, n.title, n.subtitle, n.group, n.link]));
  if (shape !== netShape || !$("net-map")) { netShape = shape; netBuild(); }
  const map = $("net-map");
  map.classList.toggle("net-stale", stale);
  for (const n of net.nodes) {
    for (const [cls, kind, state] of [["net-node", "node", n.state], ["net-link", "link", n.link_state]]) {
      const g = map.querySelector(`.${cls}[data-id="${CSS.escape(n.id)}"]`);
      if (!g) continue;
      g.classList.remove("st-up", "st-degraded", "st-down", "st-idle", "st-unknown");
      g.classList.add(`st-${state}`);
      g.classList.toggle("sel", netSel === `${kind}:${n.id}`);
      g.setAttribute("aria-label", `${n.title}: ${t("n_" + state)}`);
      const gly = g.querySelector(".gly");
      if (gly) gly.textContent = NET_GLYPH[state];
    }
  }
  const notice = $("net-notice");
  const msg = !net.ts ? t("n_wait") : stale ? t("n_stale", { t: new Date(netAt).toLocaleTimeString(LANG) }) : "";
  notice.hidden = !msg;
  notice.textContent = msg;
  netPanel();
}

async function loadNet() {
  try {
    const r = await fetch("api/topology");
    if (!r.ok) throw new Error(r.status);
    net = await r.json();
    netAt = Date.now();
  } catch (e) { /* keep the last data: netPaint marks it as stale */ }
  netPaint();
}

function setTab(name) {
  tab = name;
  $("page-mon").hidden = name !== "mon";
  $("page-stream").hidden = name !== "stream";
  $("page-net").hidden = name !== "net";
  $("mon-tools").hidden = name !== "mon";
  $("tabs").querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === name));
  history.replaceState(null, "", name === "mon" ? location.pathname + location.search : `#${name}`);
  if (name === "stream") loadStream(); else if (name === "net") loadNet(); else render();
}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); });

function onNowLoaded() {
  if ((!now.info.stream && !now.info.topology) || !$("tabs").hidden) return;
  $("tabs").hidden = false;
  $("tabs").querySelector('[data-tab="mon"]').textContent = t("tab_mon");
  $("tabs").querySelector('[data-tab="stream"]').hidden = !now.info.stream;
  $("tabs").querySelector('[data-tab="net"]').hidden = !now.info.topology;
  const wanted = location.hash.slice(1);
  setTab((wanted === "stream" && now.info.stream) || (wanted === "net" && now.info.topology) ? wanted : "mon");
  if (now.info.stream && tab !== "stream") loadStream();
  if (now.info.topology && tab !== "net") loadNet();
}

$("pin-title").textContent = t("pin_title");
$("pin-text").textContent = t("pin_text");
$("pin-ok").textContent = t("pin_ok");
$("p-close").setAttribute("aria-label", t("close"));
$("pin-close").setAttribute("aria-label", t("close"));

// Every 15 s on the Network tab (60 s elsewhere, for the alarm dot).
setInterval(() => {
  if (now?.info?.topology && (tab === "net" || Date.now() - netAt > 60000)) loadNet();
}, 15000);
// Every 5 s on the Streaming tab (30 s elsewhere, for the live dot); the session timer ticks every second.
setInterval(() => {
  if (!now?.info?.stream || $("policy").open) return;
  if (tab === "stream" || Date.now() - streamAt > 30000) loadStream();
}, 5000);
setInterval(() => {
  const el = document.getElementById("s-timer");
  if (el && el.dataset.since && stream) el.textContent = clockOf(stream.now + (Date.now() - streamAt) / 1000 - Number(el.dataset.since));
  const gt = document.getElementById("g-timer");
  if (gt && stream) gt.textContent = clockOf(Number(gt.dataset.at) - stream.now - (Date.now() - streamAt) / 1000);
}, 1000);
</script>
</body>
</html>
